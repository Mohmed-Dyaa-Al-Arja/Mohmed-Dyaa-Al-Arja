name: Generate project cards

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_project_cards.py
      - .github/workflows/project-cards.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the project cards
        run: python3 scripts/generate_project_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update project cards"
            git pull --rebase origin main
            git push
          fi
